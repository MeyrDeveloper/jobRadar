version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-secure
    restart: always
    ports:
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret_pass
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
